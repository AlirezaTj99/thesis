ekf_filter_node:
  ros__parameters:

    frequency: 50.0          # Hz — run at 50 Hz for smooth output
    sensor_timeout: 0.2      # seconds before a sensor is considered lost
    two_d_mode: true         # ignore Z, roll, pitch (2D floor navigation)

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     odom

    publish_tf: true         # EKF owns the odom→base_link TF
    publish_acceleration: false

    # ── Odometry source: /odom from go2_bridge (LIO-SAM output) ─────────────
    # Fuse yaw + velocities — NOT absolute x/y position.
    # Absolute yaw anchors the robot's heading correctly from startup.
    # Absolute x/y excluded: LIO-SAM internal loop-closures can produce discrete
    # position jumps which pass through to EKF output as high-frequency jitter.
    # Slam_toolbox corrects global drift via map→odom; EKF only needs smooth local tracking.
    odom0: /odom
    # [x,     y,     z,     roll,  pitch, yaw,   vx,    vy,    vz,    vroll, vpitch, vyaw,  ax,    ay,    az]
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # ── IMU source: /imu/data from go2_bridge (Go2 SportModeState) ──────────
    # Angular velocities + forward acceleration only — NO absolute yaw orientation.
    # Foot-impact vibrations on a legged robot create high-frequency IMU orientation
    # noise that appears as yaw jitter when fused as an absolute measurement.
    imu0: /imu/data
    # [x,     y,     z,     roll,  pitch, yaw,   vx,    vy,    vz,    vroll, vpitch, vyaw,  ax,    ay,    az]
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  true,  false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
