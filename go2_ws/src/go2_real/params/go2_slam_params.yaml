slam_toolbox:
  ros__parameters:

    # ── Frames ────────────────────────────────────────────────────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    scan_topic:  /scan
    mode:        mapping

    # ── Map resolution & range ────────────────────────────────────────────────
    resolution:       0.05      # metres per cell — fine enough for indoor rooms
    max_laser_range:  30.0      # match Go2 LiDAR range_max in pointcloud_to_laserscan

    # ── Timing ────────────────────────────────────────────────────────────────
    minimum_time_interval:  1.0   # process one scan per second — applies even when stationary
    transform_timeout:      0.2
    tf_buffer_duration:     30.0
    stack_size_to_use:      40000000

    # ── Scan matching ─────────────────────────────────────────────────────────
    use_scan_matching:     false  # disabled — map built from odometry only, no position corrections
    use_scan_barycenter:   true
    minimum_travel_distance:  0.0
    minimum_travel_heading:   0.0

    # ── Loop closure ──────────────────────────────────────────────────────────
    do_loop_closing:                       false  # disabled — no loop closure corrections
    loop_search_space_dimension:           12.0  # was 8.0 — larger search catches drift in bigger rooms
    scan_buffer_size:                      30    # was 10 — more scans = better matching quality
    scan_buffer_maximum_scan_distance:     10.0
    link_match_minimum_response_fine:      0.45  # high threshold — stationary scans update map but rarely move robot position
    link_scan_maximum_distance:            2.5
    loop_match_minimum_chain_size:         5     # need 5 consecutive good matches to confirm loop closure
    loop_match_maximum_variance_covariance: 0.1   # ~30cm uncertainty limit — tighter than 0.25 but not as strict as 0.01
    loop_match_minimum_response_coarse:    0.4
    loop_match_minimum_response_fine:      0.55

    # ── Correlation search ─────────────────────────────────────────────────────
    # Small local window (1.0m) — prevents SLAM from drifting into walls.
    # Large corrections (cable disconnect recovery) are handled by loop closure
    # (loop_search_space_dimension: 12.0m above).
    correlation_search_space_dimension:    1.0
    correlation_search_space_resolution:   0.05
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_resolution:          0.05
    loop_search_space_smear_deviation:     0.03

    # ── Scan matcher penalties ─────────────────────────────────────────────────
    distance_variance_penalty:    0.5
    angle_variance_penalty:       1.0
    fine_search_angle_offset:     0.00349
    coarse_search_angle_offset:   0.349
    coarse_angle_resolution:      0.0349
    minimum_angle_penalty:        0.9
    minimum_distance_penalty:     0.5
    use_response_expansion:       true

    # ── Solver ────────────────────────────────────────────────────────────────
    solver_plugin:          solver_plugins::CeresSolver
    ceres_linear_solver:    SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:   SCHUR_JACOBI
    ceres_trust_strategy:   LEVENBERG_MARQUARDT
    ceres_dogleg_type:      TRADITIONAL_DOGLEG
    ceres_loss_function:    None

    # Enables the SLAM Toolbox RViz panel for interactive map saving
    enable_interactive_mode: true
